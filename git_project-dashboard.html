<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimbus Project Dashboard</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
if (window.tailwind) tailwind.config = { corePlugins: { preflight: false } };
</script>
<style>
:root{
  --bg:#0d1117; --bg2:#010409; --panel:#161b22; --panel2:#0d1117; --border:#30363d; --border2:#21262d;
  --text:#e6edf3; --muted:#8b949e; --faint:#6e7681; --accent:#2f81f7; --danger:#f85149; --ok:#3fb950; --warn:#d29922;
  /* member accents: validated categorical slots (blue / orange / aqua / yellow) stepped for the dark surface */
  --c-jera:#3987e5; --c-marcus:#d95926; --c-priya:#199e70; --c-noah:#c98500; --c-team:#768390;
  --t-jera:#ffffff; --t-marcus:#ffffff; --t-priya:#03140d; --t-noah:#1a1200; --t-team:#ffffff;
  --hm0:#161b22; --hm1:#0e4429; --hm2:#006d32; --hm3:#26a641; --hm4:#39d353;
  --radius:8px; --shadow:0 8px 24px rgba(1,4,9,.55);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#ffffff; --bg2:#f6f8fa; --panel:#ffffff; --panel2:#f6f8fa; --border:#d0d7de; --border2:#eaeef2;
  --text:#1f2328; --muted:#636c76; --faint:#8c959f; --accent:#0969da; --danger:#cf222e; --ok:#1a7f37; --warn:#9a6700;
  --c-jera:#2a78d6; --c-marcus:#eb6834; --c-priya:#1baf7a; --c-noah:#eda100; --c-team:#6e7781;
  --t-jera:#ffffff; --t-marcus:#ffffff; --t-priya:#03140d; --t-noah:#1a1200; --t-team:#ffffff;
  --hm0:#ebedf0; --hm1:#9be9a8; --hm2:#40c463; --hm3:#30a14e; --hm4:#216e39;
  --shadow:0 8px 24px rgba(140,149,159,.3);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button{font-family:inherit}
code,.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-size:12px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.brand .dot{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--c-marcus),var(--c-jera))}
.brand small{font-weight:500;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:3px;flex-wrap:wrap}
.tab{padding:5px 14px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;border:none;background:none;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--text)}
.tab.active{background:var(--accent);color:#fff}
.tab .cnt{font-size:11px;background:rgba(127,127,127,.25);border-radius:20px;padding:0 6px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:#238636;border-color:rgba(240,246,252,.1);color:#fff}
.btn.primary:hover{background:#2ea043}
.btn.ghost{background:none}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn.attn{border-color:var(--warn);color:var(--warn)}
select.sel,input.inp{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:5px 8px;font-size:13px;font-family:inherit}
select.sel:focus,input.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,129,247,.25)}
.viewer{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.status-line{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint)}
.status-line .dirty{color:var(--warn);font-weight:600}
.status-line .ok{color:var(--ok)}
.legend{display:flex;gap:14px;align-items:center;padding:7px 16px;background:var(--panel2);border-bottom:1px solid var(--border);flex-wrap:wrap;font-size:12px}
.legend .item{display:flex;align-items:center;gap:6px;color:var(--muted)}
.legend .sw{width:12px;height:12px;border-radius:3px}
.avatar{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex:none;border:2px solid var(--panel)}
.avatars{display:inline-flex}.avatars .avatar{margin-left:-6px}.avatars .avatar:first-child{margin-left:0}

.menu{position:relative}
.menu summary{list-style:none}.menu summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:4px;z-index:40;min-width:170px;display:flex;flex-direction:column}
.menu-pop button{background:none;border:none;color:var(--text);text-align:left;padding:7px 10px;border-radius:5px;cursor:pointer;font-size:13px}
.menu-pop button:hover{background:var(--accent);color:#fff}
.menu-pop button.danger{color:var(--danger)}.menu-pop button.danger:hover{background:var(--danger);color:#fff}
#view{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pane{flex:1;overflow:auto;min-height:0}
.card-p{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius)}
.card-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-h h3{margin:0;font-size:14px;font-weight:600}
.card-h .sub{color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid var(--border);color:var(--muted);white-space:nowrap;line-height:18px}
.sp{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:18px;padding:0 6px;border-radius:20px;background:var(--border2);color:var(--text);font-size:11px;font-weight:700;border:1px solid var(--border)}
.lbl{font-size:11px;padding:0 7px;border-radius:20px;font-weight:600;line-height:18px;border:1px solid transparent}

/* ---------- KPI strip ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:12px 16px 0}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;min-width:0}
.kpi .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.kpi .v{font-size:20px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:6px;border-radius:3px;background:var(--border2);overflow:hidden;margin-top:6px}
.meter>i{display:block;height:100%;background:var(--ok);border-radius:3px}
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:20px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:12px;font-weight:600;color:var(--text)}
.chip.off{opacity:.38}
.chip .avatar{width:18px;height:18px;border:none}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{background:var(--panel);border:none;color:var(--muted);padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;border-right:1px solid var(--border)}
.seg button:last-child{border-right:none}
.seg button.active{background:var(--accent);color:#fff}

/* ---------- GANTT spreadsheet ---------- */
.g-scroll{flex:1;overflow:auto;min-height:0;border-top:1px solid var(--border);position:relative}
.gantt{--leftw:720px;--cols:1fr 108px 46px 66px 66px;position:relative;min-width:max-content}
.gantt.nodates{--leftw:580px;--cols:1fr 108px 46px}
.gantt.nodates .c-date{display:none}
.g-head{display:flex;position:sticky;top:0;z-index:8;background:var(--bg2);border-bottom:1px solid var(--border)}
.g-cells{display:grid;grid-template-columns:var(--cols);width:var(--leftw);flex:none;position:sticky;left:0;z-index:4;background:var(--panel2);border-right:1px solid var(--border)}
.g-head .g-cells{z-index:9;background:var(--bg2);height:66px;align-items:end}
.g-head .g-cells>div{padding:0 10px 7px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.g-head .g-cells>div.r{text-align:right}
.g-timehead{position:relative;flex:none;height:66px}
.th-months,.th-sprints,.th-ranges{position:absolute;left:0;right:0;display:block}
.th-months{top:0;height:20px;border-bottom:1px solid var(--border2)}
.th-sprints{top:20px;height:26px}
.th-ranges{top:46px;height:20px}
.th-m{position:absolute;top:0;height:20px;border-left:1px solid var(--border);font-size:11px;font-weight:700;padding:2px 8px;color:var(--text);white-space:nowrap;overflow:hidden}
.th-m.tbd{color:var(--warn)}
.th-s{position:absolute;top:0;height:46px;border-left:1px solid var(--border2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;padding:0 2px;overflow:hidden}
.th-s:hover{background:rgba(47,129,247,.10)}
.th-s b{font-size:12px;color:var(--text);white-space:nowrap}
.th-s span{font-size:10px;color:var(--faint);white-space:nowrap}
.th-s.cur{background:rgba(47,129,247,.14);box-shadow:inset 0 -2px 0 var(--accent)}
.th-s.cur b{color:var(--accent)}
.th-s .ext{position:absolute;top:2px;right:4px;font-size:9px;color:var(--warn)}
.th-s .pen{position:absolute;top:2px;left:4px;font-size:10px;color:var(--faint);opacity:0}
.th-s:hover .pen{opacity:1}
.g-body{position:relative}
.g-bg{position:absolute;top:0;bottom:0;left:var(--leftw);pointer-events:none;z-index:0}
.g-bg .sb{position:absolute;top:0;bottom:0}
.g-bg .sb.alt{background:rgba(110,118,129,.045)}
.g-bg .sb.cur{background:rgba(47,129,247,.07)}
.g-bg .ln{position:absolute;top:0;bottom:0;border-left:1px dashed var(--border2)}
.g-bg .ln.m{border-left:1px solid var(--border)}
.g-bg .ln.due{border-left:2px dashed var(--ok);opacity:.7}
.g-bg .ln.today{border-left:2px solid #f778ba;z-index:2}
.g-bg .today-tag{position:sticky;top:0;font-size:10px;font-weight:700;color:#fff;background:#f778ba;padding:0 5px;border-radius:0 3px 3px 0;margin-left:-1px;display:inline-block}
.g-group>.g-kids{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s ease,opacity .3s ease;opacity:1}
.g-group.collapsed>.g-kids{grid-template-rows:0fr;opacity:0}
.g-kids-inner{min-height:0;overflow:clip}
.g-row{display:flex;position:relative;z-index:1}
.g-row>.g-cells>div{display:flex;align-items:center;padding:0 10px;min-width:0;border-bottom:1px solid var(--border2);font-size:13px;white-space:nowrap}
.g-row .g-track{position:relative;flex:none;border-bottom:1px solid var(--border2)}
.g-row:hover .g-track{background:rgba(110,118,129,.06)}
.g-row:hover>.g-cells{background:var(--bg)}
.g-row.l1>.g-cells{background:var(--panel)}
.g-row.l1>.g-cells>div,.g-row.l1 .g-track{height:40px;border-bottom-color:var(--border)}
.g-row.l1 .g-track{background:color-mix(in srgb,var(--panel) 55%,transparent)}
.g-row.l2>.g-cells>div,.g-row.l2 .g-track{height:36px}
.g-row.l3>.g-cells>div,.g-row.l3 .g-track{height:34px}
.g-row .c-name{gap:7px;cursor:pointer}
.g-row.l1 .c-name{font-weight:700;padding-left:8px}
.g-row.l2 .c-name{font-weight:600;padding-left:26px}
.g-row.l3 .c-name{padding-left:52px;cursor:default}
.g-row .c-r{justify-content:flex-end}
.g-row .c-date{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chev{border:none;background:none;color:var(--muted);cursor:pointer;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;padding:0;flex:none;transition:transform .3s ease}
.chev:hover{background:var(--border2);color:var(--text)}
.g-group.collapsed>.g-row .chev{transform:rotate(-90deg)}
.mbar{width:4px;height:18px;border-radius:2px;flex:none}
.obj-ico{width:10px;height:10px;border-radius:3px;border:2px solid;flex:none}
.iss-ico{flex:none}
.g-row .num{color:var(--faint);font-size:12px;flex:none;cursor:pointer}
.g-row .num:hover{color:var(--accent);text-decoration:underline}
.g-row .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.g-row.done .nm{color:var(--faint);text-decoration:line-through}
.g-row .rowact{opacity:0;margin-left:auto;display:flex;gap:2px;flex:none}
.g-row:hover .rowact{opacity:1}
.iconbtn{border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;border-radius:5px;font-size:12px;padding:1px 6px;line-height:16px}
.iconbtn:hover{border-color:var(--border);color:var(--text);background:var(--panel)}
.g-row.dim{opacity:.35}
.cnt-badge{font-size:11px;font-weight:600;padding:0 7px;border-radius:20px;background:var(--border2);color:var(--muted);flex:none}

/* inline edit, GitHub style */
.ed{position:relative;border-radius:4px;cursor:text}
.ed:hover{box-shadow:inset 0 0 0 1px var(--border)}
.nm.ed:hover::after{content:"✎";font-size:11px;color:var(--faint);margin-left:6px}
.editing{box-shadow:none!important;overflow:visible!important}
.ie{display:flex;align-items:center;gap:4px;width:100%}
.ie input,.ie select{width:100%;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--accent);border-radius:5px;padding:3px 6px;font-size:12.5px;font-family:inherit;box-shadow:0 0 0 3px rgba(47,129,247,.25);outline:none}
.ie .btn{padding:2px 8px;font-size:11.5px}
.g-row .ed.flash{animation:flash 1.2s ease}
@keyframes flash{0%{background:rgba(63,185,80,.35)}100%{background:transparent}}

.bar{position:absolute;top:7px;height:20px;border-radius:5px;display:flex;align-items:center;gap:5px;padding:0 4px 0 6px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.35);min-width:8px;touch-action:none;user-select:none;transition:filter .12s}
.bar:hover{filter:brightness(1.12)}
.bar.dragging{cursor:grabbing;filter:brightness(1.15);outline:2px solid var(--text);z-index:5}
.bar.tbd{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.16) 0 6px,transparent 6px 12px)}
.bar.done{opacity:.5}
.bar.late{box-shadow:0 0 0 2px var(--danger)}
.bar .bsp{background:rgba(0,0,0,.25);border-radius:9px;padding:0 5px;font-size:10px;line-height:15px;flex:none}
.bar .btxt{overflow:hidden;text-overflow:ellipsis}
.bar .rh{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:ew-resize}
.bar .rh:hover{background:rgba(255,255,255,.3)}
.sbar{position:absolute;border-radius:3px;overflow:hidden;pointer-events:auto}
.sbar>i{position:absolute;left:0;top:0;bottom:0}
.sbar.ms{top:15px;height:10px}
.sbar.obj{top:14px;height:8px;opacity:.85}
.diamond{position:absolute;top:13px;width:14px;height:14px;transform:rotate(45deg);border:2px solid var(--bg);margin-left:-7px}
.sbar-lbl{position:absolute;top:12px;font-size:11px;color:var(--muted);white-space:nowrap;font-weight:600}

/* ---------- board ---------- */
.board{display:flex;gap:12px;padding:12px 16px 16px;min-width:max-content;height:100%}
.bcol{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);width:280px;display:flex;flex-direction:column;max-height:100%}
.bcol h3{margin:0;padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.bcol h3 .cnt{margin-left:auto;background:var(--border2);color:var(--muted);border-radius:20px;padding:1px 8px;font-size:11px}
.bcol .list{padding:8px;overflow:auto;display:flex;flex-direction:column;gap:8px;flex:1;min-height:60px;transition:background .15s}
.bcol .list.dragover{background:rgba(47,129,247,.08);outline:2px dashed var(--accent);outline-offset:-4px;border-radius:6px}
.kcard{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--c-team);border-radius:6px;padding:8px 10px;cursor:grab;font-size:13px;transition:transform .12s,box-shadow .12s}
.kcard:hover{box-shadow:var(--shadow)}
.kcard.drag{opacity:.4}
.kcard .ctop{display:flex;align-items:center;gap:6px;color:var(--faint);font-size:11px;margin-bottom:3px}
.kcard .cname{line-height:1.35}
.kcard .cbot{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11px;color:var(--muted);flex-wrap:wrap}

/* ---------- activity ---------- */
.hm-wrap{overflow-x:auto;padding:12px 14px 6px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px}
.hm .d{width:13px;height:13px;border-radius:2px;background:var(--hm0);outline:1px solid rgba(127,127,127,.12);outline-offset:-1px;cursor:pointer}
.hm .d.l1{background:var(--hm1)}.hm .d.l2{background:var(--hm2)}.hm .d.l3{background:var(--hm3)}.hm .d.l4{background:var(--hm4)}
.hm .d.fut{background:transparent;outline:1px dashed rgba(127,127,127,.18);cursor:default}
.hm .d.pad{visibility:hidden}
.hm .d.sel{outline:2px solid var(--text);outline-offset:0}
.hm .d.today{outline:2px solid #f778ba;outline-offset:0}
.hm-months{position:relative;height:16px;font-size:11px;color:var(--muted)}
.hm-months span{position:absolute;top:0}
.hm-days{display:grid;grid-template-rows:repeat(7,13px);gap:3px;font-size:10px;color:var(--muted);padding-right:6px}
.hm-days span{line-height:13px}
.hm-legend{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.hm-legend i{width:11px;height:11px;border-radius:2px;display:inline-block}
.feed{padding:0 14px 14px}
.feed .day{font-size:12px;font-weight:700;color:var(--muted);padding:14px 0 6px;border-bottom:1px solid var(--border2);margin-bottom:4px;position:sticky;top:0;background:var(--panel);z-index:1}
.ev{display:flex;gap:10px;padding:7px 0;align-items:flex-start;font-size:13px;border-bottom:1px dashed var(--border2)}
.ev:last-child{border-bottom:none}
.ev .ico{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--border);background:var(--panel2)}
.ev .body{flex:1;min-width:0;line-height:1.45}
.ev .body .meta{font-size:11px;color:var(--faint)}
.ev .ref{cursor:pointer;color:var(--accent)}
.ev .ref:hover{text-decoration:underline}
.ev .who{font-weight:600}
.ev code{background:var(--border2);padding:0 5px;border-radius:4px}
.ev .time{font-size:11px;color:var(--faint);white-space:nowrap;flex:none}
.ev.new{animation:flash 1.6s ease}
.mem-row{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border2);font-size:13px}
.mem-row:last-child{border-bottom:none}

/* ---------- analytics ---------- */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px}
.chart .axis{stroke:var(--border)}
.chart .grid{stroke:var(--border2)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--border);font-weight:700;white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--border2);white-space:nowrap}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:none}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ---------- modal / tooltip / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(1,4,9,.6);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:5vh 16px;opacity:0;pointer-events:none;transition:opacity .18s}
.overlay.open{opacity:1;pointer-events:auto}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:760px;max-height:90vh;overflow:auto;transform:translateY(8px);transition:transform .18s}
.overlay.open .modal{transform:none}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);z-index:2}

.modal header .x{cursor:pointer;color:var(--muted);font-size:22px;background:none;border:none;line-height:1}
.mbody{padding:16px 18px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}.field.two{grid-column:span 2}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:7px 9px;font-size:13px;font-family:inherit;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,129,247,.25)}
.field textarea{resize:vertical;min-height:70px}
.modal footer{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--border);align-items:center;position:sticky;bottom:0;background:var(--panel)}
.modal footer .del{color:var(--danger);margin-right:auto}
.hist{padding:0 18px 12px}
.hist h4{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px;margin:6px 0 4px}
.hint{font-size:12px;color:var(--faint)}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 9px;font-size:12px;box-shadow:var(--shadow);max-width:300px;opacity:0;transition:opacity .08s;line-height:1.45}
#tip.on{opacity:1}
#tip b{font-weight:700}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;box-shadow:var(--shadow);opacity:0;transition:all .2s;z-index:90;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
.zoomable{cursor:zoom-in;position:relative;transition:box-shadow .15s,border-color .15s}
.zoomable:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.zoomable::after{content:"⤢";position:absolute;top:6px;right:9px;font-size:14px;color:var(--faint);opacity:0;transition:opacity .15s;pointer-events:none}
.zoomable:hover::after{opacity:1}
.card-p.zoomable .card-h{padding-right:30px}
.zoom-modal{max-width:min(1280px,94vw)}
#ovZoom{align-items:center;padding:3vh 16px}

#ovZoom.open .modal{transform:none}
#zoomBody{padding:16px 18px 20px}
#zoomBody .card-p{border:none;background:none}

.empty{padding:30px;text-align:center;color:var(--faint)}
@media (max-width:1640px){ .brand small{display:none} .topbar{gap:8px} }

"use strict";
/* =====================================================================
   DATA LAYER
   Everything the UI renders comes from DataSource.load(). It returns
   plain objects shaped like a trimmed GitLab API response. To go live,
   replace MockSource with a GitLabSource that calls:
     milestones  GET /projects/:id/milestones
     objectives  GET /groups/:gid/epics      (or scoped labels "objective::…")
     issues      GET /projects/:id/issues    (weight → sp, assignees[0] → assignee,
                                              due_date → end, start date via label/custom field)
     sprints     GET /groups/:gid/iterations

const GITLAB = { enabled:false, baseUrl:"https://gitlab.example.edu/api/v4", projectId:null, groupId:null, token:"" };

const MockSource = (() => {

  const MILESTONES = [

  const AREA_OF = {Jera:"web", Marcus:"api", Priya:"mobile", Noah:"devops"};
  const PEOPLE = ["Jera","Marcus","Priya","Noah"];
  const COMMIT_MSGS = {
    web:["Add event card component","Fix layout shift on discovery page","Wire up search filters","Add responsive nav menu","Update design tokens","Add form validation to checkout"],
    api:["Add pagination to events endpoint","Add migration for bookings table","Validate venue capacity on booking","Refactor auth middleware","Add OpenAPI examples","Index events by start date"],

  };
  const COMMENTS = ["Pushed a first pass, feedback welcome.","Blocked on API keys until Thursday.","Linked the design spec in the description.","Can we review this in the next stand-up?","Updated the estimate after today's planning.","Looks good to me, merging after one more read.","Split the remaining work into a follow-up.","Added screenshots from the staging build."];

  function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  const pad=n=>String(n).padStart(2,"0");
  const P=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
  const I=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const add=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return I(d);};
  const span=(a,b)=>Math.round((P(b)-P(a))/864e5)+1;
  const F=s=>P(s).toLocaleDateString("en-US",{month:"short",day:"numeric"});

  function spFor(title,start,end){
    const d=span(start,end);
    let sp = d<=2?2 : d<=4?3 : d<=7?5 : d<=12?8 : 13;
    if(/document|records|deck|runbooks|docs/i.test(title) && sp<13) sp = sp===8?13:sp===5?8:sp===3?5:3;
    if(/kickoff|sign-off|demo|Public launch/i.test(title)) sp=Math.min(sp,3);

    const L=[]; if(AREA_OF[assignee]) L.push(AREA_OF[assignee]);
    if(/wireframe|mockup|design|architecture|model/i.test(title)) L.push("design");

    // sprints: 2-week cadence from Sep 1 2026 through the end of March 2027
    const sprints=[]; let s="2026-09-01", n=1;
    const goals=["Kickoff & stakeholder interviews","Requirements & sign-off","Wireframes, data model & architecture","Design system, API contract & staging","Mockups, security & architecture review","Auth, app shells & pipelines","Core APIs & event discovery","Booking flows","MVP integration & demo"];
    while(s<="2027-03-31"){ sprints.push({n, start:s, end:add(s,13), goal:goals[n-1]||""}); s=add(s,14); n++; }

    // ---- activity log ----
    const ev=[]; let eid=1;
    const ts=(d,h,m)=>`${d}T${pad(h)}:${pad(m)}:00`;
    const E=(t,actor,type,text,issue,meta)=>ev.push({id:eid++,ts:t,actor,type,text,issue:issue??null,meta:meta||null});
    const who=i=>i.assignee==="Team"?pick(PEOPLE):i.assignee;

    MILESTONES.forEach((m,k)=>E(ts("2026-09-01",9,2+k),PEOPLE[k%4],"milestone",`created milestone ${m.title}`));
    E(ts("2026-09-01",9,12),"Noah","sprint",`planned ${sprints.length} two-week sprints starting Sep 1`);
    issues.forEach(i=>{
      const day = i.ms===1 ? "2026-09-01" : i.ms===2 ? "2026-09-02" : i.ms===3 ? "2026-09-21" : (i.ms===4?"2026-10-05":"2026-10-06");
      const actor = i.assignee!=="Team" ? i.assignee : PEOPLE[i.id%4];

     .forEach(([id,title,a,d,b,d2,why])=>{

function ganttHTML(){

function summaryRow(level,obj,issues,X,Z,ms){

function ganttClick(e){

/* ---------- GitHub-style inline editing ---------- */
function startEdit(cell){
  if(cell.classList.contains("editing")) return;
  const [kind,idS,field]=cell.dataset.ed.split(":"); const id=+idS;
  const rec = kind==="issue"?byId(id) : kind==="ms"?msById(id) : objById(id);
  const val = rec[field];
  const orig = cell.innerHTML;
  cell.classList.add("editing");
  let ctl;
  if(field==="assignee") ctl=`<select>${ASSIGNEES.map(a=>`<option ${a===val?"selected":""}>${a}</option>`).join("")}</select>`;
  else if(field==="sp") ctl=`<select>${SP_SCALE.map(n=>`<option ${n===val?"selected":""}>${n}</option>`).join("")}</select>`;
  else if(field==="start"||field==="end"||field==="due") ctl=`<input type="date" value="${val||""}">`;
  else ctl=`<input type="text" value="${esc(val)}">`;
  const wide = field==="title";
  cell.innerHTML=`<span class="ie">${ctl}${wide?`<button class="btn primary sm" data-ok>Save</button><button class="btn sm" data-cancel>Cancel</button>`:""}</span>`;
  if(wide){ cell.style.position="relative"; }
  const input=cell.querySelector("input,select"); input.focus(); if(input.select&&field==="title") input.select();
  let finished=false;
  const finish=(commit)=>{
    if(finished) return; finished=true;
    cell.classList.remove("editing");
    if(commit){ const nv=input.value; if(applyEdit(kind,id,field,nv)) return; }
    cell.innerHTML=orig;
  };
  input.addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();finish(true);} if(e.key==="Escape"){e.preventDefault();finish(false);} });
  if(input.tagName==="SELECT") input.addEventListener("change",()=>finish(true));
  input.addEventListener("blur",()=>setTimeout(()=>finish(!cell.dataset.cancel),120));
  cell.querySelectorAll("button").forEach(b=>b.addEventListener("mousedown",e=>{ e.preventDefault(); if(b.hasAttribute("data-cancel")) finish(false); else finish(true); }));
}
// returns true when it re-rendered
function applyEdit(kind,id,field,nv){
  if(kind==="issue"){
    const i=byId(id); let ov=i[field];
    if(field==="sp") nv=+nv;
    if(field==="title"){ nv=nv.trim(); if(!nv) return false; }
    if((field==="start"||field==="end") && !nv) return false;
    if(nv===ov) return false;
    if(field==="start"&&nv>i.end){ i.end=addD(nv,diff(i.start,i.end)); }
    if(field==="end"&&nv<i.start){ toast("Due date can't be before the start date"); return false; }
    i[field]=nv;
    const ref=`#${i.id} ${i.title}`;
    if(field==="title") logEvent("issue_updated",`renamed #${i.id} from "${ov}" to "${nv}"`,i.id);
    else if(field==="assignee") logEvent("issue_updated",`reassigned ${ref} from ${ov} to ${nv}`,i.id);
    else if(field==="sp") logEvent("issue_updated",`changed story points of ${ref} from ${ov} to ${nv}`,i.id);
    else if(field==="end") logEvent(nv>ov?"deadline":"issue_updated",`${nv>ov?"extended":"moved"} due date of ${ref} from ${fmt(ov)} to ${fmt(nv)}`,i.id);
    else if(field==="start") logEvent("issue_updated",`moved start of ${ref} from ${fmt(ov)} to ${fmt(nv)}`,i.id);
  } else if(kind==="ms"){
    const m=msById(id), ov=m[field];
    if(field==="title"){ nv=nv.trim(); if(!nv||nv===ov) return false; m.title=nv; logEvent("milestone",`renamed milestone "${ov}" to "${nv}"`); }
    if(field==="due"){ nv=nv||null; if(nv===ov) return false; m.due=nv; logEvent(ov&&nv&&nv>ov?"deadline":"milestone",ov&&nv&&nv>ov?`extended milestone ${m.title} from ${fmt(ov)} to ${fmt(nv)}`:`set due date of ${m.title} to ${nv?fmt(nv):"none"}`); }
  } else {
    const o=objById(id); nv=nv.trim(); if(!nv||nv===o.title) return false;
    logEvent("milestone",`renamed objective "${o.title}" to "${nv}"`); o.title=nv;
  }
  render();
  const el=document.querySelector(`[data-ed="${kind}:${id}:${field}"]`); if(el){ el.classList.add("flash"); }
  toast("Edited · remember to Save");
  return true;
}

/* ---------- drag to move / resize bars ---------- */
let dragState=null;
function barDown(e){
  const bar=e.target.closest(".bar"); if(!bar||e.button!==0) return;
  const i=byId(+bar.dataset.bar);
  dragState={bar,i,x0:e.clientX,mode:e.target.classList.contains("rh")?"resize":"move",l0:bar.offsetLeft,w0:bar.offsetWidth,dd:0,moved:false};
  bar.setPointerCapture(e.pointerId);
  bar.addEventListener("pointermove",barMove); bar.addEventListener("pointerup",barUp,{once:true});
  tip.classList.remove("on");
}
function barMove(e){
  const d=dragState; if(!d) return;
  const dx=e.clientX-d.x0; if(Math.abs(dx)>3) d.moved=true; if(!d.moved) return;
  d.bar.classList.add("dragging");
  d.dd=Math.round(dx/ui.zoom);
  if(d.mode==="move") d.bar.style.left=(d.l0+d.dd*ui.zoom)+"px";
  else d.bar.style.width=Math.max(ui.zoom,d.w0+d.dd*ui.zoom)+"px";
  const ns=d.mode==="move"?addD(d.i.start,d.dd):d.i.start, ne=addD(d.i.end,d.dd);
  tip.innerHTML=`<b>#${d.i.id}</b> ${fmt(ns)} – ${fmt(ne<ns?ns:ne)}`; tip.classList.add("on");
  tip.style.left=(e.clientX+14)+"px"; tip.style.top=(e.clientY+14)+"px";
}
function barUp(){
  const d=dragState; dragState=null; d.bar.removeEventListener("pointermove",barMove); d.bar.classList.remove("dragging"); tip.classList.remove("on");
  if(!d.moved){ openIssue(d.i.id); return; }
  if(!d.dd){ renderOverview(); return; }
  const i=d.i, os=i.start, oe=i.end;
  if(d.mode==="move"){ i.start=addD(os,d.dd); i.end=addD(oe,d.dd); logEvent(d.dd>0?"deadline":"issue_updated",`rescheduled #${i.id} ${i.title} from ${fmt(os)}–${fmt(oe)} to ${fmt(i.start)}–${fmt(i.end)}`,i.id); }
  else { const ne=addD(oe,d.dd); i.end=ne<i.start?i.start:ne; logEvent(i.end>oe?"deadline":"issue_updated",`${i.end>oe?"extended":"shortened"} due date of #${i.id} ${i.title} from ${fmt(oe)} to ${fmt(i.end)}`,i.id); }
  renderOverview(); toast("Rescheduled · remember to Save");
}

function saveIssue(){

    deps:$("fDeps").value.split(",").map(x=>parseInt(x,10)).filter(x=>!isNaN(x)),
    labels:$("fLabels").value.split(",").map(x=>x.trim()).filter(Boolean)};
  if(!rec.obj){ const id=Math.max(0,...S.objectives.map(o=>o.id))+1; S.objectives.push({id,ms:rec.ms,title:"General"}); rec.obj=id; }
  if(editing===null){
    rec.id=nextId(); rec.closedAt=rec.status==="done"?today():null; S.issues.push(rec);
    logEvent("issue_created",`opened issue #${rec.id} ${rec.title}`,rec.id);
  } else {
    const i=byId(editing), changes=[];
    const ref=`#${i.id} ${rec.title}`;
    if(i.status!==rec.status) setStatus(i,rec.status,true);
    if(rec.end>i.end) logEvent("deadline",`extended due date of ${ref} from ${fmt(i.end)} to ${fmt(rec.end)}`,i.id);
    else if(rec.end<i.end||rec.start!==i.start) changes.push("dates");
    if(i.assignee!==rec.assignee) logEvent("issue_updated",`reassigned ${ref} from ${i.assignee} to ${rec.assignee}`,i.id);
    if(i.sp!==rec.sp) logEvent("issue_updated",`changed story points of ${ref} from ${i.sp} to ${rec.sp}`,i.id);
    if(i.title!==rec.title) changes.push("title");
    if(i.description!==rec.description) changes.push("description");
    if(i.ms!==rec.ms||i.obj!==rec.obj) changes.push("milestone/objective");
    if(i.deps.join()!==rec.deps.join()) changes.push("dependencies");
    if(i.labels.join()!==rec.labels.join()) changes.push("labels");
    if(i.tbd!==rec.tbd) changes.push("TBD flag");
    delete rec.status; Object.assign(i,rec);
    if(changes.length) logEvent("issue_updated",`edited ${changes.join(", ")} of ${ref}`,i.id);
  }
  closeOverlays(); render(); toast("Issue saved · remember to Save");
}
function setStatus(i,ns,quiet){
  const os=i.status; if(os===ns) return;
  i.status=ns;
  if(ns==="done"){ i.closedAt=today(); logEvent("issue_closed",`closed issue #${i.id} ${i.title}`,i.id); }
  else if(os==="done"){ i.closedAt=null; logEvent("issue_reopened",`reopened issue #${i.id} ${i.title} (now ${ST[ns].label})`,i.id); }
  else logEvent("status",`moved #${i.id} ${i.title} to ${ST[ns].label}`,i.id);
}
function deleteIssue(){
  if(editing===null) return; const i=byId(editing);
  if(!confirm(`Delete issue #${i.id} "${i.title}"? This is recorded in the activity log.`)) return;
  S.issues=S.issues.filter(x=>x.id!==i.id); S.issues.forEach(x=>x.deps=x.deps.filter(d=>d!==i.id));
  logEvent("issue_deleted",`deleted issue #${i.id} ${i.title}`,i.id);
  closeOverlays(); render(); toast("Issue deleted · remember to Save");
}

/* ---------- sprint modal ---------- */
let editingSprint=null;
function openSprint(n){
  const sp=S.sprints.find(s=>s.n===n); editingSprint=n;
  $("sTitle").textContent=`Edit Sprint ${n}`; $("sGoal").value=sp.goal||""; $("sStart").value=sp.start; $("sEnd").value=sp.end;
  const cnt=S.issues.filter(i=>i.end>=sp.start&&i.end<=sp.end);
  $("sHint").innerHTML=`${cnt.length} issues (${cnt.reduce((a,i)=>a+i.sp,0)} SP) are due in this sprint. Moving the end date shifts the start of the next sprint so sprints never overlap.`;
  $("ovSprint").classList.add("open");
}
function saveSprint(){
  const k=S.sprints.findIndex(s=>s.n===editingSprint), sp=S.sprints[k];
  const ns=$("sStart").value, ne=$("sEnd").value; if(!ns||!ne||ne<ns){ toast("End must be on or after start"); return; }
  const os=sp.start, oe=sp.end, og=sp.goal;
  sp.start=ns; sp.end=ne; sp.goal=$("sGoal").value.trim();
  if(k>0&&S.sprints[k-1].end>=ns) S.sprints[k-1].end=addD(ns,-1);
  for(let j=k+1;j<S.sprints.length;j++){ const a=S.sprints[j-1], b=S.sprints[j]; if(b.start<=a.end){ const len=diff(b.start,b.end); b.start=addD(a.end,1); if(b.end<b.start) b.end=addD(b.start,Math.max(len,13)); } else break; }
  if(ne>oe) logEvent("sprint_ext",`extended Sprint ${sp.n} end from ${fmt(oe)} to ${fmt(ne)}`,null,{sprint:sp.n});
  else if(ne!==oe||ns!==os) logEvent("sprint",`changed Sprint ${sp.n} dates to ${fmt(ns)} – ${fmt(ne)}`,null,{sprint:sp.n});
  if(og!==sp.goal) logEvent("sprint",`set Sprint ${sp.n} goal to "${sp.goal}"`,null,{sprint:sp.n});
  closeOverlays(); render();
}

    const d=e.ts.slice(0,10); (m[d]=m[d]||{n:0,by:{}}); m[d].n++; m[d].by[e.actor]=(m[d].by[e.actor]||0)+1;

function dailyStack(){
  const t=today(), days=[]; for(let k=41;k>=0;k--) days.push(addD(t,-k));
  const data=days.map(d=>{ const by={}; PEOPLE.forEach(p=>by[p]=0); S.events.forEach(e=>{ if(e.type==="commit"&&e.ts.startsWith(d)) by[e.actor]++; }); return {d,by,tot:PEOPLE.reduce((a,p)=>a+by[p],0)}; });
  const max=Math.max(4,...data.map(x=>x.tot)), yMax=Math.ceil(max/4)*4;
  const W=640,H=220,L=28,B=22,TP=8, pw=(W-L)/days.length, bw=Math.max(4,pw-3), y=v=>TP+(H-TP-B)*(1-v/yMax);
  let g=""; for(let k=0;k<=4;k++){ const v=yMax*k/4; g+=`<line class="grid" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`; }
  let bars="";
  data.forEach((x,k)=>{ let acc=0; const xx=L+k*pw+1.5;
    PEOPLE.forEach(p=>{ const v=x.by[p]; if(!v) return; const y1=y(acc+v), y0=y(acc); bars+=`<rect x="${xx}" y="${y1}" width="${bw}" height="${Math.max(0,y0-y1-1.5)}" rx="1.5" style="fill:${mc(p)}"/>`; acc+=v; });
    bars+=`<rect x="${L+k*pw}" y="${TP}" width="${pw}" height="${H-TP-B}" fill="transparent" data-tip="<b>${fmtL(x.d)}</b><br>${x.tot} commits<br>${PEOPLE.filter(p=>x.by[p]).map(p=>`<span style='color:${mc(p)}'>■</span> ${p} ${x.by[p]}`).join("<br>")}"/>`;
    if(pd(x.d).getDay()===1) bars+=`<text x="${xx+bw/2}" y="${H-6}" text-anchor="middle">${fmt(x.d)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily commits stacked by member">${g}<line class="axis" x1="${L}" x2="${W}" y1="${y(0)}" y2="${y(0)}"/>${bars}</svg>
    <div class="lg" style="margin-top:8px">${PEOPLE.map(p=>`<span><i style="background:${mc(p)}"></i>${p}</span>`).join("")}</div>`;
}

      <div class="kpi"><div class="k">Average velocity</div><div class="v">${avgV} SP</div><div class="s">per completed sprint</div></div>
      <div class="kpi"><div class="k">Sprint ${s.sp?s.sp.n:""} progress</div><div class="v">${s.sprintDone} / ${s.sprintSp} SP</div><div class="s">${s.sprintIssues.length} issues due this sprint</div></div>
      <div class="kpi"><div class="k">On-time delivery</div><div class="v">${(()=>{const d=S.issues.filter(i=>i.status==="done"&&i.closedAt);return d.length?Math.round(d.filter(i=>i.closedAt<=i.end).length/d.length*100):0;})()}%</div><div class="s">closed on or before due date</div></div>
      <div class="kpi"><div class="k">Total commits</div><div class="v">${S.events.filter(e=>e.type==="commit").length}</div><div class="s">${S.events.filter(e=>e.type==="mr_merged").length} merge requests merged</div></div>
      <div class="kpi"><div class="k">Remaining work</div><div class="v">${s.spTot-s.spDone} SP</div><div class="s">${s.all.length-s.done.length} open issues</div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:16px">
      <section class="card-p"><div class="card-h"><h3>Burndown</h3><span class="sub">Remaining story points</span><div style="flex:1"></div><select class="sel" id="burnSel">${sprintOpts}</select></div><div class="chart" style="padding:12px 14px" id="burn" data-chart="burn">${burndown()}</div></section>
      <section class="card-p"><div class="card-h"><h3>Velocity</h3><span class="sub">Story points committed vs completed per sprint</span></div><div class="chart" style="padding:12px 14px">${velocityChart(velo)}</div></section>
      <section class="card-p"><div class="card-h"><h3>Workload by member</h3><span class="sub">Story points by state</span></div><div class="chart" style="padding:12px 14px">${workload(memRows)}</div></section>
      <section class="card-p"><div class="card-h"><h3>Issue status</h3><span class="sub">${S.issues.length} issues</span></div><div class="chart" style="padding:12px 14px">${statusDist()}</div></section>
    </div>
    <section class="card-p"><div class="card-h"><h3>Member contributions</h3><span class="sub">Since Sep 1, 2026</span></div><div style="overflow-x:auto">
      <table class="tbl"><thead><tr><th>Member</th><th class="n">Issues</th><th class="n">Closed</th><th class="n">SP delivered</th><th class="n">SP in progress</th><th class="n">SP open</th><th class="n">Commits</th><th class="n">MRs merged</th><th class="n">Comments</th><th class="n">On time</th></tr></thead>
      <tbody>${memRows.map(r=>`<tr><td><span style="display:inline-flex;align-items:center;gap:8px">${avatar(r.p)}<b>${r.p}</b></span></td><td class="n">${r.issues}</td><td class="n">${r.done}</td><td class="n"><b>${r.spDone}</b></td><td class="n">${r.active}</td><td class="n">${r.spOpen}</td><td class="n">${r.p==="Team"?"—":r.commits}</td><td class="n">${r.p==="Team"?"—":r.mrs}</td><td class="n">${r.p==="Team"?"—":r.comments}</td><td class="n">${r.onTime==null?"—":r.onTime+"%"}</td></tr>`).join("")}</tbody></table></div></section>
  </div></div>`;
  $("burnSel").onchange=e=>{ ui.burn=e.target.value; saveUI(); $("burn").innerHTML=burndown(); };
  view.querySelectorAll(".pane .kpi, .pane .card-p").forEach(el=>{ el.classList.add("zoomable"); el.title="Click to enlarge"; });
  view.querySelector(".pane").onclick=e=>{
    if(e.target.closest("select,input,button,a,[data-open]")) return;
    const card=e.target.closest(".zoomable"); if(card) openZoom(card);
  };
}
function openZoom(card){
  const c=card.cloneNode(true);
  c.classList.remove("zoomable"); c.removeAttribute("title");
  c.querySelectorAll("[id]").forEach(el=>el.removeAttribute("id"));
  const h=c.querySelector(".card-h h3")||c.querySelector(".k");
  $("zTitle").textContent=h?h.textContent:"";
  if(c.querySelector(".card-h h3")) h.remove();
  const sel=c.querySelector("select");
  if(sel){ sel.value=ui.burn; sel.onchange=e=>{ ui.burn=e.target.value; saveUI(); c.querySelector('[data-chart="burn"]').innerHTML=burndown(); if($("burn")){ $("burn").innerHTML=burndown(); $("burnSel").value=ui.burn; } }; }
  const body=$("zoomBody"); body.innerHTML=""; body.appendChild(c);
  document.querySelector("#ovZoom .modal").style.maxWidth=c.classList.contains("kpi")?"560px":"";
  $("ovZoom").classList.add("open");
}
function burndown(){
  const t=today(); let scope, a, b, title;
  if(ui.burn==="sprint"||!ui.burn.startsWith("ms")){ const sp=sprintAt(t)||S.sprints[0]; scope=S.issues.filter(i=>i.end>=sp.start&&i.end<=sp.end); a=sp.start; b=sp.end; title=`Sprint ${sp.n}`; }
  else { const m=msById(+ui.burn.slice(2)); scope=S.issues.filter(i=>i.ms===m.id); if(!scope.length) return `<div class="empty">No issues in this milestone.</div>`; a=scope.reduce((x,i)=>i.start<x?i.start:x,scope[0].start); b=m.due||scope.reduce((x,i)=>i.end>x?i.end:x,scope[0].end); title=m.title; }
  if(!scope.length) return `<div class="empty">No issues are due in this sprint.</div>`;
  const total=scope.reduce((x,i)=>x+i.sp,0), n=diff(a,b);
  const W=640,H=240,L=34,R=12,TP=10,B=24, x=k=>L+(W-L-R)*k/Math.max(1,n), y=v=>TP+(H-TP-B)*(1-v/total);
  const pts=[]; for(let k=0;k<=n;k++){ const d=addD(a,k); if(d>t) break; const rem=total-scope.filter(i=>i.closedAt&&i.closedAt<=d).reduce((s,i)=>s+i.sp,0); pts.push({k,d,rem}); }
  let g=""; for(let q=0;q<=4;q++){ const v=Math.round(total*q/4); g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`; }
  const step=Math.max(1,Math.ceil(n/7)); for(let k=0;k<=n;k+=step) g+=`<text x="${x(k)}" y="${H-6}" text-anchor="middle">${fmt(addD(a,k))}</text>`;
  const actual=pts.map((p,j)=>`${j?"L":"M"}${x(p.k)},${y(p.rem)}`).join("");
  const last=pts[pts.length-1];
  const hits=pts.map(p=>`<rect x="${x(p.k)-(W-L-R)/n/2}" y="${TP}" width="${(W-L-R)/Math.max(1,n)}" height="${H-TP-B}" fill="transparent" data-tip="<b>${fmtL(p.d)}</b><br>${p.rem} SP remaining<br>Ideal: ${Math.round(total*(1-p.k/n))} SP"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Burndown for ${esc(title)}">${g}
    <line class="axis" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/>
    <line x1="${x(0)}" y1="${y(total)}" x2="${x(n)}" y2="${y(0)}" style="stroke:var(--faint);stroke-width:2;stroke-dasharray:5 5"/>
    ${pts.length?`<path d="${actual}" fill="none" style="stroke:var(--accent);stroke-width:2.2" stroke-linejoin="round"/><circle cx="${x(last.k)}" cy="${y(last.rem)}" r="4.5" style="fill:var(--accent);stroke:var(--panel);stroke-width:2"/><text x="${x(last.k)+8}" y="${y(last.rem)-8}" style="fill:var(--text);font-weight:600">${last.rem} SP left</text>`:""}
    ${hits}</svg>
    <div class="lg" style="margin-top:8px"><span><i style="background:var(--accent)"></i>Actual remaining</span><span><i style="background:repeating-linear-gradient(90deg,var(--faint) 0 4px,transparent 4px 7px)"></i>Ideal</span><span>${esc(title)} · ${scope.length} issues · ${total} SP</span></div>`;
}
function velocity(){
  const t=today();
  return S.sprints.filter(sp=>sp.start<=t).map(sp=>({n:sp.n, closed:sp.end<t,
    committed:S.issues.filter(i=>i.end>=sp.start&&i.end<=sp.end).reduce((a,i)=>a+i.sp,0),
    completed:S.issues.filter(i=>i.closedAt&&i.closedAt>=sp.start&&i.closedAt<=sp.end).reduce((a,i)=>a+i.sp,0)}));
}
function velocityChart(v){
  if(!v.length) return `<div class="empty">No sprints have started yet.</div>`;
  const max=Math.max(10,...v.map(x=>Math.max(x.committed,x.completed))), yMax=Math.ceil(max/20)*20;
  const W=640,H=240,L=34,B=24,TP=10, gw=(W-L)/v.length, bw=Math.min(28,(gw-14)/2), y=val=>TP+(H-TP-B)*(1-val/yMax);
  let g=""; for(let q=0;q<=4;q++){ const val=yMax*q/4; g+=`<line class="grid" x1="${L}" x2="${W}" y1="${y(val)}" y2="${y(val)}"/><text x="${L-6}" y="${y(val)+4}" text-anchor="end">${val}</text>`; }
  let bars="";
  v.forEach((s,k)=>{ const cx=L+gw*k+gw/2;
    const r=(xx,val,fill)=>{ const h=y(0)-y(val); return h>0?`<path d="M${xx},${y(0)} v${-(h-4)} q0,-4 4,-4 h${bw-8} q4,0 4,4 v${h-4}z" style="fill:${fill}"/>`:""; };
    bars+=r(cx-bw-1,s.committed,"var(--faint)")+r(cx+1,s.completed,"var(--accent)");
    bars+=`<text x="${cx}" y="${H-6}" text-anchor="middle">S${s.n}${s.closed?"":"*"}</text>`;
    bars+=`<rect x="${cx-gw/2}" y="${TP}" width="${gw}" height="${H-TP-B}" fill="transparent" data-tip="<b>Sprint ${s.n}</b>${s.closed?"":" (in progress)"}<br>Committed ${s.committed} SP<br>Completed ${s.completed} SP"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Velocity per sprint">${g}<line class="axis" x1="${L}" x2="${W}" y1="${y(0)}" y2="${y(0)}"/>${bars}</svg>
    <div class="lg" style="margin-top:8px"><span><i style="background:var(--faint)"></i>Committed</span><span><i style="background:var(--accent)"></i>Completed</span><span>* sprint in progress</span></div>`;
}
function workload(rows){
  const max=Math.max(1,...rows.map(r=>r.spDone+r.spOpen));
  const W=640,rowH=34,L=70,R=60,H=rows.length*rowH+4, x=v=>(W-L-R)*v/max;
  let h="";
  rows.forEach((r,k)=>{ const yy=k*rowH+6; let acc=L;
    const segs=[["Done",r.spDone,100],["In progress / review",r.active,60],["Not started",r.spOpen-r.active,28]];
    h+=`<text x="${L-10}" y="${yy+15}" text-anchor="end" style="fill:var(--text);font-weight:600">${r.p}</text>`;
    segs.forEach(([lab,v,o])=>{ if(!v) return; const w=x(v); h+=`<rect x="${acc}" y="${yy}" width="${Math.max(1,w-2)}" height="20" rx="3" style="fill:color-mix(in srgb,${mc(r.p)} ${o}%,var(--panel))" data-tip="<b>${r.p}</b> · ${lab}<br>${v} SP"/>`; acc+=w; });
    h+=`<text x="${acc+6}" y="${yy+15}">${r.spDone}/${r.spDone+r.spOpen} SP</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Story points per member by state">${h}</svg>
    <div class="lg" style="margin-top:8px"><span><i style="background:color-mix(in srgb,var(--muted) 100%,var(--panel))"></i>Done</span><span><i style="background:color-mix(in srgb,var(--muted) 60%,var(--panel))"></i>In progress / review</span><span><i style="background:color-mix(in srgb,var(--muted) 28%,var(--panel))"></i>Not started</span></div>`;
}
function statusDist(){
  const tot=S.issues.length||1; let acc=0, segs="", rows="";
  for(const [k,l,c] of STATUSES){ const n=S.issues.filter(i=>i.status===k).length, sp=S.issues.filter(i=>i.status===k).reduce((a,i)=>a+i.sp,0); const w=n/tot*100;
    if(n) segs+=`<div style="width:calc(${w}% - 2px);background:${c};height:100%;border-radius:3px" data-tip="<b>${l}</b><br>${n} issues · ${sp} SP"></div>`;
    rows+=`<tr><td><span style="color:${c}">●</span> ${l}</td><td class="n">${n}</td><td class="n">${sp} SP</td><td class="n">${Math.round(w)}%</td></tr>`; acc+=w; }
  return `<div style="display:flex;gap:2px;height:22px;margin:6px 0 14px">${segs}</div><table class="tbl"><tbody>${rows}</tbody></table>`;
}

/* =====================================================================
   WIRING
   ===================================================================== */
function applyTheme(){ const th=ui.theme||"dark"; document.documentElement.dataset.theme=th; }
document.getElementById("tabs").onclick=e=>{ const b=e.target.closest(".tab"); if(!b) return; ui.view=b.dataset.view; saveUI(); render(); };
$("viewer").innerHTML=PEOPLE.map(p=>`<option>${p}</option>`).join("");
$("viewer").onchange=e=>{ ui.viewer=e.target.value; saveUI(); toast(`Edits will be recorded as ${ui.viewer}`); };
document.querySelectorAll(".menu-pop button").forEach(b=>b.addEventListener("click",()=>b.closest("details").open=false));
document.addEventListener("click",e=>{ const m=document.querySelector("details.menu"); if(m.open&&!e.target.closest("details.menu")) m.open=false; });
$("btnSave").onclick=persist;
$("mSave").onclick=saveIssue; $("mDelete").onclick=deleteIssue; $("sSave").onclick=saveSprint;
$("fMs").onchange=e=>fillObj(e.target.value,null);
$("fStart").onchange=()=>{ if($("fEnd").value<$("fStart").value) $("fEnd").value=$("fStart").value; sprintHint(); };
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeOverlays);
document.querySelectorAll(".overlay").forEach(o=>o.addEventListener("mousedown",e=>{ if(e.target===o) closeOverlays(); }));
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeOverlays();
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){ e.preventDefault(); persist(); }
});
$("btnTheme").onclick=()=>{ ui.theme=document.documentElement.dataset.theme==="light"?"dark":"light"; saveUI(); applyTheme(); };
$("btnExport").onclick=()=>{ const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`project-dashboard-${iso(new Date())}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); };
$("btnImport").onclick=()=>$("fileIn").click();
$("fileIn").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.issues||!d.milestones||!d.sprints) throw new Error("missing issues, milestones or sprints"); S=d; markDirty(); render(); toast("Imported · click Save to keep"); }catch(err){ alert("Could not import: "+err.message); } };
  r.readAsText(f); e.target.value=""; };
$("btnClear").onclick=()=>{
  if(!confirm("Clear ALL data?\n\nThis removes every issue, objective, milestone and activity event so you can start from a blank project. The 2-week sprint calendar is kept.\n\nTip: use Export JSON first if you want a backup. You can bring the mock data back with Reset to mock data.")) return;
  S={asOf:iso(new Date()), source:"empty", milestones:[], objectives:[], sprints:S.sprints, issues:[], events:[], nextEventId:1};
  ui.q=""; ui.hidden=[]; ui.hmDay=null; ui.collapsed=[]; ui.boardMs="all"; saveUI();
  persist(); status("Blank project"); render(); toast("All data cleared");
};
$("btnReset").onclick=async()=>{ if(!confirm("Discard all local changes and reload the original mock data?")) return; try{ localStorage.removeItem(LS_KEY); }catch(e){} S=await DataSource.load(); dirty=false; status("Reset to mock data"); render(); };
window.addEventListener("beforeunload",e=>{ if(dirty){ e.preventDefault(); e.returnValue=""; } });

(async function init(){
  applyTheme();
  const saved=readJSON(LS_KEY);
  S = saved && saved.issues ? saved : await DataSource.load();
  if(!PEOPLE.includes(ui.viewer)) ui.viewer="Jera";
  $("viewer").value=ui.viewer;
  lastStatus = saved ? "Loaded your saved copy" : `Mock data · snapshot ${fmt(S.asOf)}`;
  status();
  render();
})();
</script>
</body>
